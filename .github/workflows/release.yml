name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_run:
    workflows: ["Semantic Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z). Leave empty to use latest release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Which tag, and whether there is anything to do at all.
  #
  # A run that follows Semantic Release only has work when Semantic Release actually published
  # something, and it says so by leaving the tag behind as an artifact. Without that this job used to
  # fall back to "the newest tag that exists", which is the *previous* release -- and the build then
  # replaced that release's binaries with code from a later commit. A published version has to mean
  # one thing forever.
  resolve:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      build: ${{ steps.resolve_tag.outputs.build }}
    steps:
      - name: Take the tag Semantic Release published
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            release|push) tag="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) tag="${INPUT_TAG}" ;;
            workflow_run) tag="$(cat release-tag.txt 2>/dev/null || true)" ;;
            *) tag="" ;;
          esac
          tag="$(echo "${tag}" | tr -d '[:space:]')"
          if [ -z "${tag}" ]; then
            echo "No release was published by this run; nothing to build."
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Building ${tag}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            allow_failure: false
          - target: aarch64-unknown-linux-gnu
            allow_failure: false
          - target: armv7-unknown-linux-gnueabihf
            allow_failure: false
          - target: arm-unknown-linux-gnueabihf
            allow_failure: true
    steps:
      # The tag, not the branch: a rebuild of an old release has to produce that release's code, and
      # a release built from a moving branch is a version number that means nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${{ needs.resolve.outputs.tag }}"
          version="${version#v}"
          bin_dir="target/${{ matrix.target }}/release"
          tar -czf "sonn-client-${version}-${{ matrix.target }}.tar.gz" -C "${bin_dir}" sonn-client
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: sonn-client-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
