[package]
name = "sonn-client"
version = "1.7.0"
edition = "2021"
description = "Sendspin-only audio endpoint for Raspberry Pi and friends, configured entirely from Sonn Core"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cpal = "0.18"
get_if_addrs = "0.5"
hostname = "0.4"
mac_address = "1.1"
mdns-sd = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Our fork's integration branch. It carries the source@v1 role -- capturing a line-in and streaming
# it to the server, which is in the spec and in the Python reference client but not in the published
# crate -- and, just as much for playback, the fixes that keep a *player* working against our own
# server: a paused group that would otherwise fail to parse, pitch frames, connection reasons this
# server sends, and the transmit stamp a lead is measured from.
#
# Each of those is a single-purpose branch of its own for upstream; `sonn` is where they are combined
# so this client can depend on one thing. Point this at a version once they land.
sendspin = { git = "https://github.com/sonn-audio/sendspin-rs.git", branch = "sonn", features = [
    "hardware-volume",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.8", features = ["v4"] }
# Pairing a Beoremote One means holding an org.bluez.Agent1 open on D-Bus for the whole window;
# see src/pairing.rs for why a bluetoothctl child process cannot do it.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Working on the fork and this client together, or building before the fork is pushed: uncomment to
# build against the checkout next door (on `sonn`) instead of what is on GitHub.
# [patch."https://github.com/sonn-audio/sendspin-rs.git"]
# sendspin = { path = "../sendspin-rs" }

# Only to silence libasound's own stderr output (see src/alsa_quiet.rs). cpal already pulls this
# in on Linux, so it costs nothing but the line.
[target.'cfg(target_os = "linux")'.dependencies]
alsa-sys = "0.4"

[profile.release]
# Speed over size, unlike the line-in bridge: this end of the wire decodes FLAC and feeds a
# real-time callback, so `opt-level = "z"` would be paid for in dropouts on a Pi Zero.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Deliberately *not* `panic = "abort"`. Each player runs as its own task; unwinding lets one
# misbehaving output die and be restarted while the rest of the device keeps playing.
